# Server
server.port=8080
spring.application.name=cmc-platform

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/cmc_nador?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50


# JWT Configuration
app.jwt.secret=cmc_nador_super_secret_key_2024_change_in_production_min_256_bits_required
app.jwt.access-token-expiration=3600000
