# =============================================
# CMC NADOR PLATFORM - Configuration de base
# =============================================
# Les valeurs sensibles (mots de passe, secret JWT) NE DOIVENT PAS figurer ici.
# Fournissez-les via :
#   1. des variables d'environnement (DB_PASSWORD, JWT_SECRET, MAIL_USERNAME, MAIL_PASSWORD, ...)
#   2. ou un fichier local NON versionné : src/main/resources/application-local.properties
#      (déjà présent dans .gitignore) — chargé automatiquement s'il existe.
spring.config.import=optional:classpath:application-local.properties

# Server
server.port=${SERVER_PORT:8080}
spring.application.name=cmc-platform

# Ne pas exposer les détails d'erreur internes au client
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cmc_nador?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# Le schéma est géré par Flyway (voir ci-dessous). Hibernate se contente de
# VALIDER que les entités correspondent au schéma migré — il ne le modifie plus.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
# Les enums Java sont stockés en VARCHAR (annotation @JdbcTypeCode(SqlTypes.VARCHAR)
# sur les entités) plutôt qu'en ENUM MySQL natif : une nouvelle valeur d'enum ne
# demande alors plus de migration de colonne.

# Flyway - migrations versionnées (src/main/resources/db/migration/V*.sql)
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
# Base déjà peuplée sans historique Flyway -> on la "baseline" à la V1
# (la V1 n'est alors PAS rejouée ; seules les V2+ s'appliquent).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline schema (pre-Flyway)

# JWT Configuration
# JWT_SECRET : chaîne d'au moins 32 caractères (256 bits). La valeur par défaut ci-dessous
# est réservée au développement local et ne doit jamais servir en production.
app.jwt.secret=${JWT_SECRET:dev-only-local-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Sécurité de connexion : verrouillage temporaire après trop d'échecs
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# Mail Configuration (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@cmc-nador.ma}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging.level.com.cmc=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
